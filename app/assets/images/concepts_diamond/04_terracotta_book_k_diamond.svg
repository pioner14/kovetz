<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <filter id="sh4" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg4)"/>

  <g filter="url(#sh4)">
    <!-- Hovering Radiant Diamond above the Book-K -->
    <g transform="translate(266,136) scale(0.85)">
      <!-- Top Table -->
      <polygon points="-42,-45 42,-45 64,-12 -64,-12" fill="#E0F2FE"/>
      <polygon points="-42,-45 0,-45 -24,-12 -64,-12" fill="#7DD3FC"/>
      <polygon points="42,-45 0,-45 24,-12 64,-12" fill="#38BDF8"/>
      <polygon points="-24,-12 24,-12 0,-45" fill="#BAE6FD"/>
      <!-- Bottom Pavilion -->
      <polygon points="-64,-12 -24,-12 0,58" fill="#0284C7"/>
      <polygon points="-24,-12 24,-12 0,58" fill="#38BDF8"/>
      <polygon points="24,-12 64,-12 0,58" fill="#0369A1"/>
      <!-- Crisp Specular Highlight -->
      <line x1="-64" y1="-12" x2="64" y2="-12" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.7"/>
      <polygon points="-42,-45 42,-45 64,-12 0,58 -64,-12" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.5" stroke-linejoin="round"/>
    </g>

    <!-- Architectural Book forming a bold K -->
    <!-- Book Spine / Left vertical bar -->
    <rect x="136" y="150" width="64" height="260" rx="14" fill="#FEF3C7"/>
    <rect x="136" y="150" width="24" height="260" rx="10" fill="#F59E0B"/>
    
    <!-- Upper Page wing of K -->
    <polygon points="196,275 336,166 376,196 236,305" fill="#FFFBEB"/>
    <!-- Lower Page wing of K -->
    <polygon points="226,280 376,386 332,410 196,310" fill="#FDE68A"/>
    
    <!-- Small Golden Padlock clasp on spine -->
    <rect x="126" y="256" width="42" height="48" rx="10" fill="#F59E0B" stroke="#431407" stroke-width="4"/>
    <circle cx="147" cy="280" r="6" fill="#431407"/>
  </g>
</svg>