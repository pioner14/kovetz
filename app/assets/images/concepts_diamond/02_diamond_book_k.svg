<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#130921"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#A855F7" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg2)"/>

  <g filter="url(#glow2)">
    <!-- Outer Book-Diamond Structure -->
    <!-- Left Wing (Page) -->
    <polygon points="256,110 156,110 86,210 256,416" fill="#F8FAFC"/>
    <polygon points="156,110 86,210 176,210" fill="#CBD5E1"/>
    <!-- Right Wing (Page) -->
    <polygon points="256,110 356,110 426,210 256,416" fill="#E9D5FF"/>
    <polygon points="356,110 426,210 336,210" fill="#C084FC"/>
    <!-- Center Facet -->
    <polygon points="176,210 336,210 256,416" fill="#7E22CE"/>
    <polygon points="256,110 336,210 176,210" fill="#A855F7"/>
    
    <!-- Crisp Book Spine & Bold Golden K -->
    <path d="M216 170 V310 M216 240 L286 170 M242 214 L292 310" stroke="url(#gold2)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Subtle Diamond rim -->
    <polygon points="156,110 356,110 426,210 256,416 86,210" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-opacity="0.6" stroke-linejoin="round"/>
  </g>
</svg>