<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <filter id="sh7" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg7)"/>

  <g filter="url(#sh7)">
    <!-- Open Minimalist Book Cradle at Bottom -->
    <path d="M100 386 C164 360, 218 370, 256 390 C294 370, 348 360, 412 386 V300 C348 274, 294 284, 256 304 C218 284, 164 274, 100 300 Z" fill="#F4F4F5"/>
    
    <!-- Two Halves of a Giant Diamond Merging Together -->
    <!-- Left Half: Sapphire Blue (Device 1) -->
    <g transform="translate(-8, 0)">
      <polygon points="168,120 256,120 256,184 114,184" fill="#38BDF8"/>
      <polygon points="168,120 256,120 212,184 114,184" fill="#7DD3FC"/>
      <polygon points="114,184 212,184 256,336" fill="#0284C7"/>
      <polygon points="212,184 256,184 256,336" fill="#0EA5E9"/>
    </g>
    
    <!-- Right Half: Warm Amber Gold (Device 2) -->
    <g transform="translate(8, 0)">
      <polygon points="256,120 344,120 398,184 256,184" fill="#FBBF24"/>
      <polygon points="256,120 344,120 398,184 300,184" fill="#FDE047"/>
      <polygon points="300,184 398,184 256,336" fill="#D97706"/>
      <polygon points="256,184 300,184 256,336" fill="#F59E0B"/>
    </g>

    <!-- Central Golden Lock / Clasp binding the two diamond halves -->
    <rect x="232" y="196" width="48" height="56" rx="10" fill="#FFFFFF" stroke="#18181B" stroke-width="4"/>
    <path d="M244 196 V182 C244 170, 268 170, 268 182 V196" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
    <circle cx="256" cy="224" r="6" fill="#18181B"/>
  </g>
</svg>