<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg7" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="sh7" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg7)"/>

  <g filter="url(#sh7)">
    <!-- Left DB Cylinder (Backup 1) -->
    <g transform="translate(80, 140)">
      <ellipse cx="46" cy="24" rx="46" ry="18" fill="#38BDF8"/>
      <path d="M0 24 V64 C0 74, 20 82, 46 82 C72 82, 92 74, 92 64 V24 Z" fill="#0284C7"/>
      <path d="M0 64 V104 C0 114, 20 122, 46 122 C72 122, 92 114, 92 104 V64 Z" fill="#0369A1"/>
    </g>

    <!-- Right DB Cylinder (Backup 2) -->
    <g transform="translate(340, 140)">
      <ellipse cx="46" cy="24" rx="46" ry="18" fill="#A855F7"/>
      <path d="M0 24 V64 C0 74, 20 82, 46 82 C72 82, 92 74, 92 64 V24 Z" fill="#7E22CE"/>
      <path d="M0 64 V104 C0 114, 20 122, 46 122 C72 122, 92 114, 92 104 V64 Z" fill="#6B21A8"/>
    </g>

    <!-- Confluence Pipeline / Merge arrows -->
    <path d="M172 200 C210 200, 230 250, 256 270 C282 250, 302 200, 340 200" stroke="url(#pipeGrad)" stroke-width="16" stroke-linecap="round" fill="none"/>

    <!-- Output: Clean Markdown Document Card -->
    <g transform="translate(186, 260)">
      <rect width="140" height="170" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
      <!-- Markdown [M ↓] Iconic Header -->
      <rect x="18" y="18" width="104" height="44" rx="8" fill="#0F172A"/>
      <!-- M letter -->
      <path d="M32 48 V32 L42 42 L52 32 V48" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <!-- Down arrow -->
      <path d="M86 32 V44 M78 38 L86 46 L94 38" stroke="#A855F7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <!-- Exported Note lines -->
      <rect x="24" y="80" width="92" height="8" rx="4" fill="#FACC15"/>
      <rect x="24" y="98" width="80" height="8" rx="4" fill="#38BDF8"/>
      <rect x="24" y="116" width="86" height="8" rx="4" fill="#34D399"/>
      <rect x="24" y="134" width="60" height="8" rx="4" fill="#94A3B8"/>
    </g>
  </g>
</svg>