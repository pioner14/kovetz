<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="gold5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <filter id="sh5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg5)"/>

  <g filter="url(#sh5)">
    <!-- Left Scroll Roll -->
    <rect x="100" y="150" width="54" height="220" rx="27" fill="#FEF3C7" stroke="url(#gold5)" stroke-width="4"/>
    <!-- Right Scroll Roll -->
    <rect x="358" y="150" width="54" height="220" rx="27" fill="#FEF3C7" stroke="url(#gold5)" stroke-width="4"/>
    
    <!-- Parchment sheet between them -->
    <path d="M127 175 C200 150, 312 150, 385 175 V345 C312 320, 200 320, 127 345 Z" fill="#FFFBEB"/>
    
    <!-- Notes inscribed on scroll -->
    <rect x="170" y="205" width="140" height="10" rx="5" fill="#38BDF8"/>
    <rect x="170" y="227" width="160" height="10" rx="5" fill="#FDE047"/>
    <rect x="170" y="249" width="110" height="10" rx="5" fill="#4ADE80"/>
    <rect x="170" y="271" width="130" height="8" rx="4" fill="#94A3B8"/>

    <!-- Diagonal Golden Calligraphy Quill -->
    <g transform="rotate(35 270 240)">
      <!-- Feather spine & vane -->
      <path d="M270 90 C295 140, 285 240, 270 320 C255 240, 245 140, 270 90 Z" fill="url(#gold5)"/>
      <line x1="270" y1="90" x2="270" y2="340" stroke="#FEF08A" stroke-width="4"/>
      <!-- Nib tip -->
      <polygon points="265,335 275,335 270,360" fill="#FFFFFF"/>
    </g>
  </g>
</svg>