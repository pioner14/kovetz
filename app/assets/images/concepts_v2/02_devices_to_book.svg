<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="devLeft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="devRight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="sh2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg2)"/>

  <!-- Left Device: Smartphone -->
  <g filter="url(#sh2)" transform="translate(80, 110)">
    <rect width="140" height="260" rx="24" fill="#1E293B" stroke="#475569" stroke-width="4"/>
    <rect x="10" y="16" width="120" height="228" rx="14" fill="url(#devLeft)"/>
    <!-- Phone notes lines -->
    <rect x="24" y="50" width="80" height="10" rx="4" fill="#FDE047"/>
    <rect x="24" y="72" width="92" height="10" rx="4" fill="#93C5FD"/>
    <rect x="24" y="94" width="64" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.7"/>
    <circle cx="70" cy="230" r="6" fill="#FFFFFF" fill-opacity="0.4"/>
  </g>

  <!-- Right Device: Tablet -->
  <g filter="url(#sh2)" transform="translate(280, 110)">
    <rect width="152" height="260" rx="24" fill="#1E293B" stroke="#475569" stroke-width="4"/>
    <rect x="10" y="16" width="132" height="228" rx="14" fill="url(#devRight)"/>
    <!-- Tablet notes lines -->
    <rect x="24" y="50" width="100" height="10" rx="4" fill="#6EE7B7"/>
    <rect x="24" y="72" width="86" height="10" rx="4" fill="#FDA4AF"/>
    <rect x="24" y="94" width="74" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.7"/>
    <circle cx="76" cy="230" r="6" fill="#FFFFFF" fill-opacity="0.4"/>
  </g>

  <!-- Central Convergence: Unified Open Book & Gold Shield -->
  <g filter="url(#sh2)">
    <path d="M176 340 C216 324, 244 330, 256 344 C268 330, 296 324, 336 340 V200 C296 184, 268 190, 256 204 C244 190, 216 184, 176 200 Z" fill="#FFFFFF" stroke="#F59E0B" stroke-width="4"/>
    <path d="M246 380 L256 360 L266 380 Z" fill="#F59E0B"/>
    <circle cx="256" cy="266" r="20" fill="#F59E0B"/>
    <path d="M248 266 L254 272 L266 260" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>