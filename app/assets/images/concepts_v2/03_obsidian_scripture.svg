<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#180828"/>
      <stop offset="100%" stop-color="#2E1048"/>
    </linearGradient>
    <linearGradient id="crystalTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="crystalLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E22CE"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>
    <linearGradient id="crystalRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg3)"/>

  <!-- Open Bible Pages at bottom -->
  <path d="M100 410 C170 380, 224 394, 256 414 C288 394, 342 380, 412 410 V280 C342 250, 288 264, 256 284 C224 264, 170 250, 100 280 Z" fill="#F3E8FF" fill-opacity="0.9"/>
  <!-- Text lines with golden and cyan highlights on the book -->
  <rect x="130" y="306" width="88" height="10" rx="5" fill="#FDE047"/>
  <rect x="130" y="326" width="70" height="8" rx="4" fill="#A855F7" fill-opacity="0.4"/>
  <rect x="294" y="306" width="88" height="10" rx="5" fill="#38BDF8"/>
  <rect x="294" y="326" width="74" height="8" rx="4" fill="#A855F7" fill-opacity="0.4"/>

  <!-- Linking rays from crystal down to scripture -->
  <line x1="256" y1="200" x2="160" y2="300" stroke="#C084FC" stroke-width="3" stroke-dasharray="6 4" stroke-opacity="0.7"/>
  <line x1="256" y1="200" x2="352" y2="300" stroke="#38BDF8" stroke-width="3" stroke-dasharray="6 4" stroke-opacity="0.7"/>
  <line x1="256" y1="200" x2="256" y2="380" stroke="#FDE047" stroke-width="4" stroke-opacity="0.8"/>

  <!-- Floating Faceted Obsidian Gem -->
  <g filter="url(#glow3)">
    <!-- Top Crown -->
    <polygon points="256,90 330,150 256,180 182,150" fill="url(#crystalTop)"/>
    <!-- Bottom Left Facet -->
    <polygon points="182,150 256,180 256,260 182,190" fill="url(#crystalLeft)"/>
    <!-- Bottom Right Facet -->
    <polygon points="330,150 256,180 256,260 330,190" fill="url(#crystalRight)"/>
    <!-- Center Brilliance Diamond -->
    <polygon points="256,140 280,165 256,190 232,165" fill="#FFFFFF" fill-opacity="0.8"/>
  </g>
</svg>