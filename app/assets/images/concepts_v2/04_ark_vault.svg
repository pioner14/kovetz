<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#1E1B2E"/>
    </linearGradient>
    <linearGradient id="arkGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <filter id="sh4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg4)"/>

  <g filter="url(#sh4)">
    <!-- Ark Chest Base -->
    <rect x="110" y="240" width="292" height="170" rx="28" fill="#27272A" stroke="url(#arkGold)" stroke-width="12"/>
    <!-- Ark Chest Lid Rim -->
    <rect x="92" y="226" width="328" height="36" rx="18" fill="url(#arkGold)"/>
    
    <!-- Emerging Tablets of Covenant / Notes (Glowing upward) -->
    <!-- Left Tablet -->
    <path d="M166 220 C166 140, 190 120, 220 120 H240 V226 H166 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3"/>
    <!-- Right Tablet -->
    <path d="M346 220 C346 140, 322 120, 292 120 H272 V226 H346 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="3"/>
    
    <!-- Script lines on tablets -->
    <rect x="180" y="150" width="44" height="8" rx="4" fill="#38BDF8"/>
    <rect x="180" y="168" width="48" height="8" rx="4" fill="#FACC15"/>
    <rect x="180" y="186" width="36" height="8" rx="4" fill="#94A3B8"/>
    
    <rect x="284" y="150" width="44" height="8" rx="4" fill="#34D399"/>
    <rect x="284" y="168" width="48" height="8" rx="4" fill="#FB7185"/>
    <rect x="284" y="186" width="36" height="8" rx="4" fill="#94A3B8"/>

    <!-- Golden Lock Keyhole Plate -->
    <circle cx="256" cy="320" r="28" fill="url(#arkGold)"/>
    <circle cx="256" cy="314" r="8" fill="#18181B"/>
    <polygon points="252,316 260,316 262,332 250,332" fill="#18181B"/>
  </g>
</svg>