<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg8" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090E17"/>
      <stop offset="100%" stop-color="#1E2238"/>
    </linearGradient>
    <filter id="sh8" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg8)"/>

  <g filter="url(#sh8)">
    <!-- Center Study Notebook with Wire Binding -->
    <rect x="156" y="140" width="200" height="270" rx="20" fill="#FFFFFF"/>
    <!-- Left Wire spiral rings -->
    <circle cx="176" cy="180" r="6" fill="#94A3B8"/>
    <circle cx="176" cy="220" r="6" fill="#94A3B8"/>
    <circle cx="176" cy="260" r="6" fill="#94A3B8"/>
    <circle cx="176" cy="300" r="6" fill="#94A3B8"/>
    <circle cx="176" cy="340" r="6" fill="#94A3B8"/>
    <circle cx="176" cy="380" r="6" fill="#94A3B8"/>

    <!-- Incoming Colorful Notes Flying In from all angles -->
    <!-- Top-Left: Yellow Note (Meeting notes) -->
    <g transform="rotate(-12 110 130)">
      <rect x="80" y="90" width="100" height="90" rx="12" fill="#FDE047" filter="url(#sh8)"/>
      <rect x="92" y="110" width="60" height="6" rx="3" fill="#A16207"/>
      <rect x="92" y="124" width="74" height="6" rx="3" fill="#A16207"/>
    </g>

    <!-- Top-Right: Cyan Note (Personal Study) -->
    <g transform="rotate(14 390 120)">
      <rect x="330" y="80" width="100" height="90" rx="12" fill="#38BDF8" filter="url(#sh8)"/>
      <rect x="344" y="100" width="68" height="6" rx="3" fill="#0369A1"/>
      <rect x="344" y="114" width="54" height="6" rx="3" fill="#0369A1"/>
    </g>

    <!-- Bottom-Left: Coral Note (Highlights) -->
    <g transform="rotate(10 110 370)">
      <rect x="70" y="320" width="96" height="86" rx="12" fill="#FB7185" filter="url(#sh8)"/>
      <rect x="84" y="340" width="64" height="6" rx="3" fill="#9F1239"/>
    </g>

    <!-- Bottom-Right: Emerald Note (Tags) -->
    <g transform="rotate(-8 390 360)">
      <rect x="340" y="310" width="96" height="86" rx="12" fill="#34D399" filter="url(#sh8)"/>
      <rect x="354" y="330" width="60" height="6" rx="3" fill="#065F46"/>
    </g>

    <!-- Center notebook merged seal: Golden Checkmark Star -->
    <circle cx="266" cy="270" r="32" fill="#F59E0B"/>
    <path d="M252 270 L262 280 L282 260" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>