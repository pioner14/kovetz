<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg10" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#1A1C29"/>
    </linearGradient>
    <filter id="glow10" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg10)"/>

  <!-- Gothic Arch Frame in Gold -->
  <g filter="url(#glow10)">
    <path d="M120 400 V230 C120 150, 256 90, 256 90 C256 90, 392 150, 392 230 V400 Z" fill="none" stroke="#F59E0B" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Central Lead dividers (Arch & Book cross) -->
    <line x1="256" y1="90" x2="256" y2="400" stroke="#F59E0B" stroke-width="10"/>
    <line x1="120" y1="250" x2="392" y2="250" stroke="#F59E0B" stroke-width="10"/>

    <!-- Stained Glass Segments (The 4 Study Colors) -->
    <!-- Top-Left: Radiant Sapphire Blue -->
    <path d="M130 240 V230 C130 170, 246 116, 246 116 V240 Z" fill="#0284C7" fill-opacity="0.85"/>
    <!-- Top-Right: Deep Royal Amber Gold -->
    <path d="M382 240 V230 C382 170, 266 116, 266 116 V240 Z" fill="#F59E0B" fill-opacity="0.85"/>
    <!-- Bottom-Left: Emerald Green -->
    <rect x="130" y="260" width="116" height="130" fill="#059669" fill-opacity="0.85"/>
    <!-- Bottom-Right: Ruby Magenta / Rose -->
    <rect x="266" y="260" width="116" height="130" fill="#E11D48" fill-opacity="0.85"/>

    <!-- Central Illuminated Open Scripture in Glass -->
    <path d="M186 270 C220 256, 244 260, 256 270 C268 260, 292 256, 326 270 V220 C292 206, 268 210, 256 220 C244 210, 220 206, 186 220 Z" fill="#FFFFFF" stroke="#FDE047" stroke-width="4"/>
    <circle cx="256" cy="245" r="8" fill="#F59E0B"/>
  </g>
</svg>