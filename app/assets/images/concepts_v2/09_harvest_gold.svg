<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg9" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="gold9" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="sh9" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg9)"/>

  <!-- Open Bible at base -->
  <path d="M96 400 C160 376, 214 388, 256 406 C298 388, 352 376, 416 400 V320 C352 296, 298 308, 256 326 C214 308, 160 296, 96 320 Z" fill="#F8FAFC" filter="url(#sh9)"/>

  <!-- Rising Sheaf of Golden Leaves / Wheat-Pages (Gathering: Kovetz) -->
  <g filter="url(#sh9)">
    <!-- Left Wheat Leaf -->
    <path d="M256 350 C180 300, 140 210, 166 120 C220 160, 240 250, 256 350 Z" fill="url(#gold9)" fill-opacity="0.85"/>
    <!-- Right Wheat Leaf -->
    <path d="M256 350 C332 300, 372 210, 346 120 C292 160, 272 250, 256 350 Z" fill="url(#gold9)" fill-opacity="0.9"/>
    <!-- Center Golden Stem -->
    <path d="M256 360 C226 250, 226 170, 256 94 C286 170, 286 250, 256 360 Z" fill="url(#gold9)"/>
    
    <!-- Central Golden Crown Ring -->
    <rect x="212" y="290" width="88" height="30" rx="15" fill="#FEF08A" stroke="#B45309" stroke-width="3"/>
    <!-- Inner Diamond Gem on Ring -->
    <polygon points="256,295 266,305 256,315 246,305" fill="#064E3B"/>
  </g>
</svg>